[package]
name = "agent-meter"
version = "0.1.0"
edition = "2021"
description = "Herdr popup showing Claude Code and Codex subscription usage"

[lib]
name = "agent_meter"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
